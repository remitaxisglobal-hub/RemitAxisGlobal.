<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
Login | RemitAxisGlobal
</title>

<link
rel="stylesheet"
href="css/style.css"
>

</head>


<body>


<header class="navbar">

<div class="logo">
RemitAxis<span>Global</span>
</div>

</header>



<main>

<section class="auth-section">

<div class="auth-card">

<p class="eyebrow dark">
WELCOME BACK
</p>

<h1>
Log in
</h1>

<p>
Access your RemitAxisGlobal
development dashboard.
</p>


<form
class="auth-form"
onsubmit="event.preventDefault(); loginUser();"
>


<label>
Email
</label>

<input
type="email"
id="loginEmail"
placeholder="you@example.com"
required
>


<label>
Password
</label>

<input
type="password"
id="loginPassword"
placeholder="Your password"
required
>


<button
type="submit"
class="auth-button"
>
Log In
</button>


<p
id="loginMessage"
class="form-message"
>
</p>


</form>


<p class="auth-link">
Don't have an account?
<a href="register.html">
Create one
</a>
</p>


</div>

</section>

</main>



<script src="js/auth.js"></script>

</body>

</html>
