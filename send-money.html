<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
Send Money | RemitAxisGlobal
</title>

<link
rel="stylesheet"
href="css/style.css"
>

</head>


<body>


<header class="navbar">

<div class="logo">
RemitAxis<span>Global</span>
</div>


<nav id="navMenu">

<a href="index.html">
Home
</a>

<a href="dashboard.html">
Dashboard
</a>

<a href="rates.html">
Rates
</a>

</nav>

</header>



<main>

<section class="market-section">


<div class="section-heading">

<p class="eyebrow dark">
CROSS-BORDER PAYMENTS
</p>

<h1>
Create a Transfer
</h1>

<p>
Create a transfer connected to your
authenticated account.
</p>

</div>



<div class="dashboard-panel">


<div
class="api-status demo"
>
● Authenticated
</div>


<form
class="auth-form"
onsubmit="event.preventDefault(); createAuthenticatedTransfer();"
>


<label>
Recipient
</label>

<input
type="text"
id="recipientName"
placeholder="Recipient name"
required
>


<label>
Amount
</label>

<input
type="number"
id="transferAmount"
placeholder="100"
min="0.01"
step="0.01"
required
>


<label>
Send Currency
</label>

<select
id="transferFrom"
>

<option value="USD">
USD
</option>

<option value="ZAR">
ZAR
</option>

<option value="KES">
KES
</option>

<option value="GBP">
GBP
</option>

<option value="EUR">
EUR
</option>

<option value="ZMW">
ZMW
</option>

<option value="BWP">
BWP
</option>

</select>


<label>
Receive Currency
</label>

<select
id="transferTo"
>

<option value="ZAR">
ZAR
</option>

<option value="USD">
USD
</option>

<option value="KES">
KES
</option>

<option value="GBP">
GBP
</option>

<option value="EUR">
EUR
</option>

<option value="ZMW">
ZMW
</option>

<option value="BWP">
BWP
</option>

</select>


<button
type="submit"
class="auth-button"
>
Create Transfer
</button>


<p
id="transferResult"
class="form-message"
>
</p>


</form>

</div>


</section>

</main>



<script src="js/auth.js"></script>
<script>
    requireLogin();
</script>

<script src="js/script.js"></script>


</body>

</html>
